name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: incidentes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d incidentes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: BACK-END
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/incidentes_test
      JWT_SECRET: ci-only-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BACK-END/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run lint

  despliegue:
    if: github.event_name == 'push'
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar despliegue en Render
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
      - name: Avisar si falta el Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK == '' }}
        run: echo "::warning::Configura RENDER_DEPLOY_HOOK para activar el despliegue continuo."
